# 部署到 GitHub Pages：测试 → 构建 → 发布 dist/
# 用法：仓库 Settings → Pages → Source 选「GitHub Actions」，然后推送 main/master 即可。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 setup-vp 代替 setup-node：它会装好 vp CLI、Node，以及 devEngines 里
      # 钉住的 npm 版本，并接管依赖缓存。之前 setup-node + npm ci 会因为 Node 24
      # 自带 npm 11 与 devEngines 的 npm 12.2.0 冲突而报 EBADDEVENGINES。
      # 注意：钉确切版本号，v1 浮动标签已冻结不再更新。
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Lint + format check
        run: vp check

      - name: Type check (vue-tsc)
        run: vp run type-check

      - name: Unit tests
        run: vp test

      - name: Build（项目页自动带 /仓库名/ base）
        run: vp run build
        env:
          GITHUB_PAGES: 'true'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
