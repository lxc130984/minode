<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>minode · 节点世界</title>
  </head>

  <body>
    <div id="app"></div>
    <script>
      window.__bootErrs = [];
      window.addEventListener("error", function (e) {
        window.__bootErrs.push(
          "ERROR: " + (e.message || "") + " @ " + (e.filename || "") + ":" + (e.lineno || 0)
        );
        var d = document.createElement("pre");
        d.id = "boot-err";
        d.style.cssText = "position:fixed;top:0;left:0;z-index:99999;background:#c00;color:#fff;padding:6px;font-size:12px;white-space:pre-wrap;max-width:100vw;";
        d.textContent = window.__bootErrs.join("\n");
        document.body.appendChild(d);
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__bootErrs.push("REJECT: " + (e.reason && (e.reason.stack || e.reason.message || e.reason)));
        var d = document.getElementById("boot-err") || document.createElement("pre");
        d.id = "boot-err";
        d.style.cssText = "position:fixed;top:0;left:0;z-index:99999;background:#c00;color:#fff;padding:6px;font-size:12px;white-space:pre-wrap;max-width:100vw;";
        d.textContent = window.__bootErrs.join("\n");
        document.body.appendChild(d);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
